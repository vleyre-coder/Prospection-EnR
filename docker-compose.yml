# Pile complete : PostGIS, API et interface.
#
#   ./demarrer.sh                   # voie recommandee (verifie Docker, ouvre le navigateur)
#   docker compose up -d --build    # equivalent direct
#   docker compose up -d bdd        # base seule (developpement local du code)
#   docker compose logs -f api      # suivre le chargement initial des donnees
#
# Aucune variable n'est obligatoire : au premier demarrage l'API applique ses migrations,
# genere son secret de signature, cree un compte administrateur et charge les donnees
# nationales manquantes.
services:
  bdd:
    image: postgis/postgis:16-3.4
    container_name: enr-bdd
    environment:
      POSTGRES_USER: enr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enr}
      POSTGRES_DB: prospection_enr
      # Le tri francais est necessaire pour les recherches par nom de commune.
      LANG: fr_FR.utf8
    ports:
      - '${PORT_BDD:-5432}:5432'
    volumes:
      - bdd_donnees:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enr -d prospection_enr']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: enr-api
    depends_on:
      bdd:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://enr:${POSTGRES_PASSWORD:-enr}@bdd:5432/prospection_enr
      # Optionnel : a defaut, un secret aleatoire est genere au premier demarrage et
      # conserve en base. Le definir explicitement reste preferable en production.
      SECRET_JWT: ${SECRET_JWT:-}
      # Renseigner ces deux variables fixe les identifiants d'administration. Sans elles,
      # un compte est cree au premier demarrage avec un mot de passe affiche dans les
      # journaux (docker compose logs api).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_MOT_DE_PASSE: ${ADMIN_MOT_DE_PASSE:-}
      # Mettre a false pour piloter l'ingestion par un ordonnanceur externe.
      AMORCAGE_AUTO: ${AMORCAGE_AUTO:-true}
      REPERTOIRE_DONNEES: /app/donnees
      NIVEAU_LOG: ${NIVEAU_LOG:-info}
      # Derriere un proxy d'entreprise : Node ignore HTTPS_PROXY sans NODE_USE_ENV_PROXY.
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-bdd,localhost,127.0.0.1}
      NODE_USE_ENV_PROXY: ${NODE_USE_ENV_PROXY:-}
    volumes:
      # Rasters volumineux (gisement de vent, 55 Mo) : a conserver entre les recreations de
      # conteneur, sinon ils sont retelecharges a chaque fois.
      - api_donnees:/app/donnees
    ports:
      - '${PORT_API:-3000}:3000'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: enr-web
    depends_on:
      - api
    ports:
      - '${PORT_WEB:-8080}:80'
    restart: unless-stopped

volumes:
  bdd_donnees:
  api_donnees:
