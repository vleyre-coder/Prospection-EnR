# Integration continue.
#
# Elle manquait entierement : rien n'empechait un push de casser le moteur de scoring, et
# trois regressions sont effectivement passees en production avant d'etre vues a l'usage.
#
# L'ordre compte. Les tests de `@enr/scoring` et de `@enr/core` s'executent contre `dist/`, pas
# contre les sources : lancer les tests sans construire d'abord les ferait passer contre un build
# perime - c'est deja arrive, deux tests etaient au vert contre du code obsolete. La construction
# est donc une etape a part entiere, avant les tests.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Une seule execution par branche : un push qui en suit un autre annule le precedent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Typage, construction et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Le projet utilise `process.loadEnvFile` (Node >= 20.12) et le lanceur de tests
          # integre. La version 22 est celle de l'image Docker de production.
          node-version: '22'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Verifier le typage
        run: npm run typecheck

      - name: Construire
        run: npm run build

      - name: Tester
        run: npm test

  migrations:
    name: Migrations SQL et calculs PostGIS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Les migrations sont le seul endroit ou une faute ne se voit ni au typage ni aux tests
    # unitaires : une colonne mal nommee ne casse qu'au demarrage, chez l'utilisateur. Une
    # base jetable suffit a le detecter.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enr_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @enr/core --workspace @enr/scoring

      # Le referentiel reglementaire porte une date de derniere verification. Une date n'a de
      # valeur que si quelque chose la surveille : sans cette etape, elle vieillit en silence et
      # l'application raisonne sur du droit perime dans des documents transmis a des tiers.
      - name: Verifier la fraicheur du referentiel reglementaire
        run: node scripts/verifier-fraicheur-referentiel.mjs


      - name: Appliquer les migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/enr_ci
        run: npm run migrate --workspace @enr/api

      # Cette etape verifiait « l'idempotence des migrations ». Elle ne le pouvait pas : le
      # runner tient une table de suivi et n'execute aucun fichier deja enregistre, donc un
      # second appel ne rejoue rien par construction. Ce qui est reellement teste ici, et qui
      # est la propriete utile en exploitation (le serveur applique les migrations a chaque
      # demarrage), c'est qu'un second passage n'applique RIEN et ne casse rien.
      - name: Un second passage n'applique aucune migration
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/enr_ci
        run: |
          sortie=$(npm run --silent migrate --workspace @enr/api 2>&1)
          echo "$sortie"
          echo "$sortie" | grep -q '"appliquees":0' \
            || { echo "::error::un second passage a applique des migrations"; exit 1; }

      # Le SQL n'est PAS rejouable a la main dans l'absolu (la migration 010 redefinit une vue
      # de 005 par CREATE OR REPLACE ; rejouer 005 ensuite echoue). C'est sans consequence
      # tant que la table de suivi existe, mais sa perte rendait le demarrage impossible sans
      # porte de sortie. On verifie donc que la porte de sortie fonctionne.
      - name: Une base privee de sa table de suivi reste recuperable
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/enr_ci
        run: |
          # Suppression via `pg` plutot que psql : le client PostgreSQL n'est pas garanti
          # present sur l'image du runner, la dependance `pg` l'est.
          node --input-type=module -e "
            import { Client } from 'pg';
            const c = new Client(process.env.DATABASE_URL);
            await c.connect();
            await c.query('DROP TABLE migration_appliquee');
            await c.end();
          "
          npm run --silent migrate --workspace @enr/api -- --adopter
          sortie=$(npm run --silent migrate --workspace @enr/api 2>&1)
          echo "$sortie"
          echo "$sortie" | grep -q '"appliquees":0' \
            || { echo "::error::la base n'est pas revenue a un etat stable"; exit 1; }

      # Huit audits ont montre qu'un test peut passer sans rien proteger. Chaque mutation de ce
      # script correspond a un defaut REELLEMENT survenu et doit faire echouer au moins un test :
      # une mutation qui passe signale un test decoratif, ce qui est une regression a part entiere.
      #
      # `DATABASE_URL` est indispensable ici depuis l'audit 8 : une des mutations retablit le defaut
      # de `patrimoine()`, et le test qui l'attrape a besoin d'une base. Sans cette variable, le test
      # s'ignorait et la mutation passait — le script signalait alors a tort un test decoratif.
      - name: Verifier par mutation que les gardes protegent vraiment
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/enr_ci
        run: node scripts/mutation.mjs

      # Deux calculs metier vivent en SQL : la part de recouvrement d'un zonage (qui
      # designe le zonage dominant, donc un knock-out) et le nombre de groupes de parcelles
      # jointives d'un site (qui gouverne la surface implantable). Dans le job precedent ils
      # sont ignores faute de base, et un test ignore protege de rien. C'est ici qu'ils
      # tournent pour de vrai.
      - name: Tester les calculs geometriques contre PostGIS
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/enr_ci
        run: npx tsx --test test/postgis.test.ts
        working-directory: apps/api

      # `patrimoine()` portait le defaut le plus grave des huit audits, et aucun test ne pouvait le
      # voir parce qu'aucun test ne touchait la base : quatre types patrimoniaux etaient lus, un seul
      # est ingere, et les trois listes vides devenaient des absences CONSTATEES. Ces tests exigent
      # une base ; sans cette etape ils s'ignorent, et un test ignore protege de rien.
      - name: Tester la presence des couches patrimoniales contre PostGIS
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/enr_ci
        run: npx tsx --test test/patrimoine-couches.test.ts
        working-directory: apps/api

      # Audit 9. Deux familles de defauts n'etaient visibles qu'en base :
      #   - A1, les listes triees puis tronquees sans ordre total : 38 % des parcelles renvoyees
      #     changeaient selon le plan choisi par PostgreSQL, et des parcelles du haut du classement
      #     n'apparaissaient sur aucune page ;
      #   - A3, la distance au plus proche calculee sur un disque partiellement ingere, qui virait
      #     la parcelle au ROUGE sur le critere le plus lourd pour un trou dans la donnee.
      # Les deux fichiers s'ignorent sans base, et un test ignore protege de rien.
      - name: Tester la stabilite des listes et la couverture du disque contre PostGIS
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/enr_ci
        run: >-
          npx tsx --test test/pagination-stable.test.ts test/couverture-disque.test.ts
          test/snapshot-perime-par-donnee.test.ts test/disparus.test.ts
        working-directory: apps/api

      # Ce fichier modifie le schema (il supprime la table de suivi, renomme `parcelle`) :
      # il ne tourne que sur la base jetable de la CI, et apres les tests PostGIS.
      - name: Tester la reprise d'une base privee de sa table de suivi
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/enr_ci
          # Opt-in obligatoire : sans lui, ces tests s'ignorent, pour qu'un `npm test` lance
          # avec un DATABASE_URL de production ne touche jamais au schema.
          TESTS_MIGRATIONS: '1'
        run: npx tsx --test test/migrations.test.ts
        working-directory: apps/api
