# Service du frontend et proxy vers l'API.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression : le bundle cartographique est volumineux.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Les fichiers versionnes par empreinte sont immuables.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # L'API, y compris les tuiles vectorielles.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # La qualification d'une emprise interroge une dizaine de sources par parcelle :
    # elle peut depasser la minute.
    proxy_read_timeout 300s;
    proxy_connect_timeout 15s;
  }

  # Application a page unique.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
